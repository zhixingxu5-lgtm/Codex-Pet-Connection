name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            hookBinary: target/release/petlink-hook
            bundlePaths: |
              target/release/bundle/dmg/*.dmg
          - os: windows-latest
            platform: windows
            hookBinary: target/release/petlink-hook.exe
            bundlePaths: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    env:
      PETLINK_SERVER_URL: ${{ vars.PETLINK_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production service URL
        shell: bash
        run: |
          case "$PETLINK_SERVER_URL" in
            https://*) ;;
            *) echo "PETLINK_SERVER_URL must be a non-empty HTTPS GitHub Variable" >&2; exit 1 ;;
          esac
          app_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "$GITHUB_REF_NAME" = "v$app_version" || {
            echo "tag $GITHUB_REF_NAME does not match app version v$app_version" >&2
            exit 1
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: cargo check --locked --workspace
      - run: cargo build --locked --release -p petlink-hook
      - shell: bash
        run: |
          mkdir -p "integrations/codex-marketplace/plugins/codex-pet-link/bin/${{ matrix.platform }}"
          cp "${{ matrix.hookBinary }}" "integrations/codex-marketplace/plugins/codex-pet-link/bin/${{ matrix.platform }}/"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --verbose
      - shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then checksum="sha256sum"; else checksum="shasum -a 256"; fi
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 \
            | xargs -0 $checksum > "target/release/bundle/SHA256SUMS-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ matrix.bundlePaths }}
            target/release/bundle/SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**
