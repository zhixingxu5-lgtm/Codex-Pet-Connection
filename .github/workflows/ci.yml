name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://petlink:petlink@127.0.0.1:5432/petlink_test
      RUN_NETWORK_E2E: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petlink
          POSTGRES_PASSWORD: petlink
          POSTGRES_DB: petlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petlink -d petlink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:plugin
      - run: pnpm validate:repo
      - run: docker build -f services/sync-server/Dockerfile .

  rust:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo check --workspace
